name: Refresh contributions chart

on:
  schedule:
    - cron: '17 3 * * *' # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-contributions.mjs'
      - '.github/workflows/contributions.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-contributions.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions-light.svg assets/contributions-dark.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh contributions chart"
            git push
          fi
